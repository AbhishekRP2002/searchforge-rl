# Launch config: `uv run vf-eval @ configs/eval.toml`
#
# Pins the three settings whose library defaults are wrong for this project. The
# policy model is still overridable with `-m`; everything here is a default, not a lock.

model = "deepseek/deepseek-v4-flash"

[env.agent.harness]
# `bash` is the library default and needs a machine to run bash in, which drags in a
# provisioned VM. This taskset drives tools directly, so the null harness is both
# correct and free.
id = "null"

[env.agent.runtime]
# The library default is `prime` with `vm = true` — a remote VM billed by the minute.
# One task took 15 minutes to provision and produced nothing. `docker` runs locally and
# is the only local runtime that enforces the task's `network_allow = []` policy;
# `subprocess` errors out with "does not support framework-aware policies".
type = "docker"

[env.taskset]
# Without the id, the CLI cannot tell which taskset owns `providers` and rejects the
# file, so `vf-eval @ configs/eval.toml` needs no positional `searchforge`.
id = "searchforge"
# A list set here cannot be overridden by `--env.taskset.providers` on the same command
# line (the CLI rejects the string). Edit this line, or drop `@ configs/eval.toml`.
providers = ["serper", "exa"]

[env.taskset.task.tools]
# The defaults, written out so a preset diff shows exactly what it changes. Both caps
# are applied in the tool server on normalised text, identically for every provider.
enable_fetch = true
max_page_chars = 8000
max_excerpt_chars = 2000
fetch_pagination = false
max_tool_calls = 10
