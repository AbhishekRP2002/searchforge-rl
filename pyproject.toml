[project]
name = "searchforge"
version = "0.1.0"
description = "searchforge — provider-attributable evaluation and RL for live web search agents."
requires-python = ">=3.11,<3.14"
dependencies = [
    "verifiers==0.3.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["searchforge"]
artifacts = ["searchforge/data/*.jsonl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not live'"
markers = [
    "live: calls real provider APIs and requires credentials in .env",
]
